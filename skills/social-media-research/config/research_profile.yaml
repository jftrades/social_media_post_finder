profile_name: europe-north-america-fitness-research
intended_account: ideas_by_ferdi

coverage:
  regions:
    - europe
    - united_states
    - canada
  other_regions: only_when_explicitly_requested
  discovery_languages: [en, de]
  report_language: de
  platforms:
    - youtube_shorts
    - tiktok
    - instagram_reels
  minimum_video_duration_seconds: 30

research_window:
  default_days: 7
  fallback_days: 14
  disclose_fallback_extension: true

intake:
  ask_before_research: true
  maximum_questions: 2
  ask_for_seed_or_open_scan: true
  ask_for_focus_and_time_window: true

full_report_targets:
  trends: 15
  formats_or_challenges: 15
  viral_hooks: 15

retrieval_budget:
  minimum_candidates_for_full_scan: 60
  maximum_candidates: 150
  stop_when_targets_are_verified: true
  never_pad_to_target: true

outlier_method:
  creator_baseline_video_count: 10
  strong_outlier_ratio: 2.0
  prefer_age_comparable_posts: true
  require_direct_public_source: true

ranking_signals:
  - creator_relative_outlier
  - views_per_day_when_available
  - cross_creator_recurrence
  - recency
  - evidence_completeness
  - topic_relevance

report_output:
  default_format: typst_pdf
  template: skills/social-media-research/assets/global-fitness-research.typ
  directory: output/research
  save_source_typ: true
  save_pdf: true
  chat_summary: true
  direct_source_per_item: true
  detached_source_dump: false

scope_exclusions:
  - favorite_creator_watchlists
  - own_video_analysis
  - own_account_comparison
  - content_ideas
  - rewritten_hooks
  - scripts
  - storytelling
  - production_planning
  - editing
  - forced_university_angle
  - publishing_or_account_actions
